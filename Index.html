    // --- 4. AUDIO / TTS & SOUND FX HELPER ---
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel(); // Stop active speaking

      const utterance = new SpeechSynthesisUtterance(text);
      if (currentLang === 'mr') utterance.lang = 'mr-IN';
      else if (currentLang === 'hi') utterance.lang = 'hi-IN';
      else utterance.lang = 'en-IN';
      utterance.rate = 0.9; // Slightly slower for crisp shop-floor clarity
      window.speechSynthesis.speak(utterance);
    }

    function playSound(type) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'success') {
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
          osc.frequency.setValueAtTime(880.00, audioCtx.currentTime + 0.1); // A5
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.35);
        } else if (type === 'error') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, audioCtx.currentTime);
          osc.frequency.setValueAtTime(146, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        }
      } catch (e) {
        console.log("Audio FX not permitted yet without interaction");
      }
    }

        btn.classList.remove('text-blue-800');
        btn.classList.add('text-slate-500');
      });

      if (screen === 'home') renderHomeScreen(container);
      else if (screen === 'safety') renderSafetyListScreen(container);
      else if (screen === 'step_view') renderStepView(container, payload);
      else if (screen === 'quiz_view') renderQuizView(container, payload);
      else if (screen === 'voice') renderVoiceScreen(container);
      else if (screen === 'shifts') renderShiftScreen(container);
      else if (screen === 'feedback') renderFeedbackScreen(container);
      else if (screen === 'admin') renderAdminDashboard(container);
    }
